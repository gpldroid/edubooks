name: Astro build validation

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Export generated npm lockfile for reproducible install
        uses: actions/upload-artifact@v4
        with:
          name: generated-npm-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Validate Astro components and TypeScript
        run: npm run check
      - name: Run project regression tests
        run: npm test
      - name: Build Astro site
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run responsive browser tests
        run: npm run test:e2e
