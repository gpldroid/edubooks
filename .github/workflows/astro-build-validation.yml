name: Astro build validation

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install PDF production toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils fonts-dejavu-core python3-docx librsvg2-bin
      - name: Generate six PDFs and five-page previews for site validation
        run: bash .github/scripts/build_all_pdfs.sh
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Astro components and TypeScript
        run: npm run check
      - name: Run project regression tests
        run: npm test
      - name: Build Astro site
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run responsive browser tests
        run: npm run test:e2e
      - name: Upload responsive visual proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-visual-proofs
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 3
