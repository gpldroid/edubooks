name: Build Book 01 PDFs for internal review only

on:
  pull_request:
    paths:
      - 'content/books/01-language-foundations/**'
      - 'docs/production/latex-preamble.tex'
      - '.github/workflows/publish-book-01-pdfs.yml'
  push:
    branches: [main]
    paths:
      - 'content/books/01-language-foundations/**'
      - 'docs/production/latex-preamble.tex'
      - '.github/workflows/publish-book-01-pdfs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: book-01-internal-pdf-review
  cancel-in-progress: true
jobs:
  build-and-review:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-lang-french texlive-lang-spanish poppler-utils
      - name: Build and validate three independent review editions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/review/books
          for lang in en fr es; do
            case "$lang" in
              en) title="Language Foundations — English Edition"; tag="en-GB"; unit="Unit"; answer="Answer key";;
              fr) title="Fondements de l’apprentissage des langues — Édition française"; tag="fr-FR"; unit="Unité"; answer="Corrigé";;
              es) title="Fundamentos del aprendizaje de idiomas — Edición española"; tag="es-ES"; unit="Unidad"; answer="Soluciones";;
            esac
            source="content/books/01-language-foundations/$lang/manuscript.md"
            output="build/review/books/edubooks-book-01-$lang.pdf"
            count="$(grep -Ec "^## ${unit} [0-9]+ — " "$source" || true)"
            test "$count" -eq 10
            pandoc "$source" --from=gfm --standalone --toc --toc-depth=2 --pdf-engine=xelatex \
              --include-in-header=docs/production/latex-preamble.tex --resource-path=. \
              -V mainfont="DejaVu Sans" -V lang="$tag" -V geometry:paper=a4paper \
              -V geometry:margin=18mm -V fontsize=10pt -V colorlinks=true \
              -V title="$title" -V author="EduBooks" -o "$output"
            test -s "$output"
            pages="$(pdfinfo "$output" | awk '/^Pages:/ {print $2}')"
            test "$pages" -ge 10
            pdftotext "$output" "build/review/books/$lang.txt"
            grep -Fq "$answer" "build/review/books/$lang.txt"
            for n in {1..10}; do grep -Fq "$unit $n" "build/review/books/$lang.txt"; done
            echo "$lang: $pages pages validated for internal review"
          done
          (cd build/review/books && sha256sum edubooks-book-01-*.pdf > SHA256SUMS.txt)
      - name: Upload English review candidate
        uses: actions/upload-artifact@v4
        with:
          name: book-01-en-review-candidate
          path: build/review/books/edubooks-book-01-en.pdf
          if-no-files-found: error
          retention-days: 90
      - name: Upload French review candidate
        uses: actions/upload-artifact@v4
        with:
          name: book-01-fr-review-candidate
          path: build/review/books/edubooks-book-01-fr.pdf
          if-no-files-found: error
          retention-days: 90
      - name: Upload Spanish review candidate
        uses: actions/upload-artifact@v4
        with:
          name: book-01-es-review-candidate
          path: build/review/books/edubooks-book-01-es.pdf
          if-no-files-found: error
          retention-days: 90
      - name: Upload checksums and extracted text
        uses: actions/upload-artifact@v4
        with:
          name: book-01-review-manifest
          path: |
            build/review/books/SHA256SUMS.txt
            build/review/books/en.txt
            build/review/books/fr.txt
            build/review/books/es.txt
          if-no-files-found: error
          retention-days: 90
